# 文档组件注册表
# 本文件定义所有可用的文档组件，供 AI 根据项目类型和模块特征动态选择并组装文档。
# 使用方式：配套 components-guide.md 中的映射表和策略进行选择。

components:

  # ═══════════════════════════════════════════════════════
  # P0 级组件（必需）
  # ═══════════════════════════════════════════════════════

  overview:
    purpose: 模块概述，说明解决什么问题、为什么存在
    format: "2-3 段文字 + 架构位置说明"
    trigger: 必需
    fallback: 无
    required_context:
      - 模块名和路径
      - CodePurpose
      - 依赖关系
      - 核心职责列表

  api-table:
    purpose: 公开接口总览
    format: Markdown 表格
    trigger: 必需
    fallback: 无
    required_context:
      - 导出声明
      - 函数签名
      - 参数类型
    variants:
      - name: 接口表
        columns: [接口, 类型, 描述, 源码]
      - name: 枚举表
        columns: [枚举值, 显示名, 检测信号]
      - name: 方法表
        columns: [方法, 用途, 默认行为]
      - name: 配置表
        columns: [配置项, 类型, 默认值, 描述]

  nav-links:
    purpose: 文档导航链接
    format: Markdown 表格或列表
    trigger: 必需
    fallback: 无
    required_context:
      - 相关文档路径

  # ═══════════════════════════════════════════════════════
  # P1 级组件（高优先级）
  # ═══════════════════════════════════════════════════════

  sequence-diagram:
    purpose: 展示跨组件/模块的交互流程和时序
    format:
      - 变体A: Mermaid sequenceDiagram（参与者 <= 6）
      - 变体B: 流程表格（参与者 > 6 或流水线）
      - 变体C: 文字步骤列表（简单线性流程）
    trigger:
      - CodePurpose in [Api, Service, Agent, Entry, Command]
      - OR 模块有跨组件数据流
      - OR 函数调用链深度 >= 3
    fallback:
      - 若参与者 > 8，拆分为多张子图
      - 若 LLM 生成失败，使用流程表格替代
    required_context:
      - 接口签名
      - 依赖关系
      - 关键函数调用链

  code-walkthrough:
    purpose: 对关键代码片段进行逐块讲解，解释"为什么这样实现"
    format:
      - 格式A: 代码块 + 行内注释 + 逐块讲解表格
      - 格式B: 带注释代码 + 关键点说明
      - 格式C: 对比讲解（重构/优化场景）
    trigger:
      - 函数复杂度 >= 50
      - OR CodePurpose in [Agent, Service, Api, Command]
      - OR 文件包含设计模式实现（单例、工厂、观察者等）
      - OR 核心算法（排序、搜索、状态机）
    fallback:
      - 若 LLM 无法生成讲解，仅输出代码块 + 函数签名说明
    required_context:
      - 完整函数代码（或截断后保留重要行）
      - 函数签名和参数说明
      - 调用关系

  architecture-diagram:
    purpose: 展示系统/模块的层次结构
    format: Mermaid flowchart TB
    trigger:
      - 模块包含 2+ 子模块
      - OR CodePurpose in [Entry, Page, Command]
      - OR 文件结构深度 >= 2
    fallback:
      - 若模块简单，用文字列表描述层次
    required_context:
      - 模块列表和依赖关系
      - 文件结构

  # ═══════════════════════════════════════════════════════
  # P2 级组件（中优先级）
  # ═══════════════════════════════════════════════════════

  class-diagram:
    purpose: 展示类/接口的继承和组合关系
    format: Mermaid classDiagram
    trigger:
      - 模块导出 class/struct/interface
      - OR 存在继承关系（extends/implements）
    fallback:
      - 若无继承关系，用接口表格代替
    required_context:
      - 类定义和属性
      - 方法签名
      - 继承关系

  state-diagram:
    purpose: 展示状态机或生命周期
    format: Mermaid stateDiagram-v2
    trigger:
      - CodePurpose == Agent
      - OR 显式状态管理（useState/useReducer/状态模式）
      - OR 生命周期方法（onMount/onDestroy 等）
    fallback:
      - 用文字列表描述状态和转换条件
    required_context:
      - 状态变量定义
      - 状态转换触发条件

  dependency-diagram:
    purpose: 展示模块间的依赖方向
    format: Mermaid flowchart LR
    trigger:
      - 模块有内部依赖或被其他模块依赖
      - OR 依赖数 >= 2
    fallback:
      - 用依赖表格代替
    required_context:
      - import 语句
      - 模块依赖关系

  er-diagram:
    purpose: 展示实体关系、表结构和外键约束
    format: Mermaid erDiagram
    trigger:
      - CodePurpose == Database
      - OR 模块定义了 ORM 模型 / SQL 表 / Prisma schema
    fallback:
      - 实体超过 8 个时仅展示核心实体
      - 无外键时使用简单的表结构列表
      - 复杂关系用 Markdown 表格替代
    required_context:
      - 实体/模型定义
      - 外键关系
      - 字段/列定义

  decision-table:
    purpose: 展示策略选择、条件分支、决策逻辑
    format: Markdown 表格
    trigger:
      - 存在多层处理策略
      - OR 有条件分支逻辑
      - OR 需要对比不同方案
    fallback:
      - 用列表替代
    required_context:
      - 决策条件
      - 各分支结果

  code-example:
    purpose: 展示使用方法
    format: 代码块 + 场景说明
    trigger:
      - 模块复杂度 >= 低
      - OR 公开接口 >= 1
    fallback:
      - 若 LLM 无法生成，仅输出基本调用示例
    required_context:
      - 模块公开接口
      - 典型使用场景

  # ═══════════════════════════════════════════════════════
  # P3 级组件（低优先级）
  # ═══════════════════════════════════════════════════════

  error-table:
    purpose: 错误类型及处理方式
    format: Markdown 表格
    trigger:
      - 模块定义自定义错误类型
      - OR 函数签名包含 throws/Result/Error
      - OR CodePurpose in [Api, Service, Agent, Dao]
    fallback:
      - 若无显式错误定义，跳过
    required_context:
      - 错误类型定义
      - 异常抛出点

  file-structure:
    purpose: 展示模块文件组织
    format: 目录树 + 职责表
    trigger:
      - 模块包含 2+ 源文件
    fallback:
      - 单文件模块用一句话说明
    required_context:
      - 文件列表
      - 每个文件的导出内容

  usage-patterns:
    purpose: 典型使用场景和模式
    format: 场景描述 + 代码 + 预期结果
    trigger:
      - 模块复杂度 >= 中等
      - OR 公开接口 >= 3
      - OR CodePurpose in [SDK, Util, Service]
    fallback:
      - 用多个 code-example 代替
    required_context:
      - 模块公开接口
      - 业务场景
