# 文档组件注册表
# 本文件定义所有可用的文档组件，供 AI 根据项目类型和模块特征动态选择并组装文档。
# 使用方式：配套 components-guide.md 中的映射表和策略进行选择。

components:

  # ═══════════════════════════════════════════════════════
  # P0 级组件（必需）
  # ═══════════════════════════════════════════════════════

  relevant-source-files:
    purpose: 页面顶部折叠区块，列出本页最相关的 3-10 个源码文件及行号范围
    format: 树形列表（details 折叠），每项包含 file:// 链接、行号范围和相关原因
    trigger: 必需
    fallback: 无
    position: 页面顶部，标题之后第一个区块
    required_context:
      - 模块核心文件列表
      - public_interfaces 的 line/end_line
      - core_source_ranges
      - parse-results.json / code-structure.json.definitions

  sources:
    purpose: 页面末尾汇总本页实际引用过的所有源码文件和行号范围，方便读者最后统一核对
    format: 按文件分组的源码引用列表，每项包含 file:// 链接和行号范围
    trigger: 必需（Test 类模块可豁免）
    fallback: 无
    position: 页面末尾，nav-links 之前
    required_context:
      - 本页各章节中实际引用过的源码文件和行号范围
      - 章节内 Source: 链接和 Section sources 链接的并集

  overview:
    purpose: 模块概述，说明解决什么问题、为什么存在
    format: "2-3 段文字 + 架构位置说明"
    trigger: "CodePurpose not in [Test]"
    fallback: 无
    required_context:
      - 模块名和路径
      - CodePurpose
      - 依赖关系
      - 核心职责列表

  api-table:
    purpose: 公开接口总览
    format: Markdown 表格
    trigger: "模块有公开导出（public_interfaces 非空或 exported symbols >= 1）；纯配置或内部文件可降级"
    fallback: 无
    required_context:
      - 导出声明
      - 函数签名
      - 参数类型
    variants:
      - name: 接口表
        columns: [接口, 类型, 描述, 源码]
      - name: 枚举表
        columns: [枚举值, 显示名, 检测信号]
      - name: 方法表
        columns: [方法, 用途, 默认行为]
      - name: 配置表
        columns: [配置项, 类型, 默认值, 描述]

  nav-links:
    purpose: 文档导航链接
    format: Markdown 表格或列表
    trigger: 必需
    fallback: 无
    required_context:
      - 相关文档路径

  # ═══════════════════════════════════════════════════════
  # P1 级组件（高优先级）
  # ═══════════════════════════════════════════════════════

  architecture-fit:
    purpose: 自上而下说明模块在整体架构中的位置、边界、职责和不该承担的职责
    format:
      - 架构层级说明 + 边界表
      - Mermaid flowchart（可选，高亮当前模块）
    trigger:
      - CodePurpose in [Entry, Agent, Service, Api, Command, Database]
      - OR 模块被 2+ 其他模块依赖
      - OR 模块处在跨层调用链上
    fallback:
      - 用"所在层 / 负责什么 / 不负责什么"三列表格替代图
    required_context:
      - architecture-skeleton.json
      - module_summary
      - dependency_hints
      - import_relations

  design-rationale:
    purpose: 自上而下解释设计思路，说明为什么这样设计、受哪些约束影响、替代方案是什么
    format:
      - 设计目标
      - 约束条件
      - 当前方案
      - 替代方案与取舍表
    trigger:
      - CodePurpose in [Entry, Agent, Service, Api, Command, Database]
      - OR 模块复杂度 >= 30
      - OR key_insights 非空
    fallback:
      - 若设计意图无法从源码直接确认，标注为"推断"并说明证据来源
    required_context:
      - module_summary
      - key_insights
      - risk_points
      - extension_points
      - 核心源码片段

  design-patterns:
    purpose: 识别并解释模块实际使用的设计模式或架构套路，而不是仅贴模式名称
    format:
      - 模式名称
      - 代码证据
      - 解决的问题
      - 带来的代价
    trigger:
      - 文件包含设计模式实现（工厂、策略、适配器、观察者、仓储、中间件链、插件注册、状态机等）
      - OR patterns 非空
      - OR CodePurpose in [Agent, Service, Dao, Command]
    fallback:
      - 若没有明确模式，输出"未发现强设计模式，仅采用直接实现"并跳过详细展开
    required_context:
      - patterns
      - class/function definitions
      - call_graph
      - key_insights

  performance-tradeoffs:
    purpose: 解释性能相关设计取舍，包括热路径、缓存、IO、并发、批处理、复杂度和内存占用
    format:
      - 性能关注点表
      - 当前取舍
      - 潜在瓶颈
      - 可优化方向
    trigger:
      - 模块复杂度 >= 50
      - OR 存在循环、批处理、缓存、网络/文件/数据库 IO
      - OR CodePurpose in [Service, Api, Dao, Database, Agent, Command]
    fallback:
      - 若无明显性能敏感路径，输出"当前不是性能热点"和判断依据
    required_context:
      - complexity_score
      - call_graph
      - dependency_hints
      - core_files
      - 核心源码片段

  sequence-diagram:
    purpose: 展示跨组件/模块的交互流程和时序
    format:
      - 变体A: Mermaid sequenceDiagram（参与者 <= 6）
      - 变体B: 流程表格（参与者 > 6 或流水线）
      - 变体C: 文字步骤列表（简单线性流程）
    trigger:
      - CodePurpose in [Api, Service, Agent, Entry, Command]
      - OR 模块有跨组件数据流
      - OR 函数调用链深度 >= 3
    fallback:
      - 若参与者 > 8，拆分为多张子图
      - 若 LLM 生成失败，使用流程表格替代
    required_context:
      - 接口签名
      - 依赖关系
      - 关键函数调用链

  code-walkthrough:
    purpose: 核心逻辑。通过精简版核心源码、带注释源码、源码行范围和逐段解释，讲清主路径、关键分支、重要变量、依赖调用和"为什么这样实现"
    format:
      - 格式A: 精简版核心源码（伪代码或裁剪代码，10-30 行）+ 目的说明
      - 格式B: Source 链接（file://...#Lx-Ly）+ 带中文注释的关键源码片段（20-80 行，可拆 1-3 段）+ 逐段讲解表格
      - 格式C: 关键变量/分支/调用/错误路径说明 + 设计取舍
      - 格式D: 对比讲解（重构/优化场景）
    trigger:
      - 函数复杂度 >= 50
      - OR CodePurpose in [Agent, Service, Api, Command]
      - OR 文件包含设计模式实现（单例、工厂、观察者等）
      - OR 核心算法（排序、搜索、状态机）
      - OR 模块存在主执行路径或关键扩展点
    fallback:
      - 若源码过长，先输出裁剪片段或伪代码，再说明省略内容
      - 若无法安全摘取长片段，输出精简伪代码 + 关键函数签名 + 分支说明
    required_context:
      - 完整函数代码（或截断后保留重要行）
      - 函数签名和参数说明
      - 调用关系
      - 模块主路径或关键扩展点
      - 关键变量、关键分支和错误路径
      - 源码文件路径与 start_line/end_line

  architecture-diagram:
    purpose: 展示系统/模块的层次结构
    format: Mermaid flowchart TB
    trigger:
      - 模块包含 2+ 子模块
      - OR CodePurpose in [Entry, Page, Command]
      - OR 文件结构深度 >= 2
    fallback:
      - 若模块简单，用文字列表描述层次
    required_context:
      - 模块列表和依赖关系
      - 文件结构

  internal-structure:
    purpose: 中层解释模块内部如何组织，说明子组件、文件、类、函数之间的职责分工
    format:
      - 内部结构图（Mermaid flowchart，可选）
      - 职责分工表
      - 关键协作关系说明
    trigger:
      - 模块包含 2+ 源文件
      - OR 模块包含 3+ 公开接口
      - OR 模块包含多个 class/function 协作
      - OR CodePurpose in [Agent, Service, Api, Command, Database, Page]
    fallback:
      - 单文件模块用"内部结构较简单"加职责列表替代
    required_context:
      - file-structure
      - public_interfaces
      - call_graph
      - module_summary

  execution-flow:
    purpose: 中层解释模块主执行路径，从入口、调度、处理到输出，不进入逐行源码
    format:
      - 主流程步骤表
      - Mermaid flowchart 或 sequenceDiagram（可选）
      - 正常路径与异常路径分开说明
    trigger:
      - CodePurpose in [Entry, Agent, Service, Api, Command]
      - OR 存在入口函数、handler、route、command、job、worker
      - OR call_graph 深度 >= 2
    fallback:
      - 简单线性模块用 3-5 步文字列表
    required_context:
      - entry_points
      - call_graph
      - public_interfaces
      - dependency_hints

  data-flow:
    purpose: 中层解释数据在模块内如何输入、校验、转换、存储或输出
    format:
      - 数据流图（可选）
      - 输入/转换/输出表
      - 关键数据结构说明
    trigger:
      - CodePurpose in [Api, Service, Dao, Database, Agent, Page]
      - OR 模块处理 DTO、schema、payload、state、event、record
      - OR 存在数据库、文件、网络、队列或状态读写
    fallback:
      - 无明显数据转换时，说明"该模块主要透传或编排数据"
    required_context:
      - public_interfaces
      - key_sequences
      - dependency_hints
      - model/schema definitions

  # ═══════════════════════════════════════════════════════
  # P2 级组件（中优先级）
  # ═══════════════════════════════════════════════════════

  tradeoff-analysis:
    purpose: 汇总可维护性、扩展性、一致性、性能、复杂度之间的综合取舍
    format: Markdown 表格（维度 / 当前选择 / 收益 / 代价 / 何时重看）
    trigger:
      - risk_points 非空
      - OR extension_points 非空
      - OR 模块复杂度 >= 40
      - OR CodePurpose in [Agent, Service, Api, Database, Command]
    fallback:
      - 合并到 design-rationale 的"替代方案与取舍"小节
    required_context:
      - risk_points
      - extension_points
      - key_insights
      - dependency_hints

  side-effects:
    purpose: 中层列出模块会改变哪些外部世界，包括数据库、文件、网络、缓存、事件、日志和全局状态
    format: Markdown 表格（副作用 / 触发点 / 影响范围 / 回滚或恢复方式 / 证据）
    trigger:
      - 存在数据库写入、文件写入、网络请求、缓存更新、事件发布、日志、进程环境修改
      - OR CodePurpose in [Api, Service, Dao, Database, Agent, Command]
    fallback:
      - 若无外部副作用，明确标注"未发现外部副作用"，并说明依据
    required_context:
      - call_graph
      - dependency_hints
      - key_insights
      - 核心源码片段

  invariants:
    purpose: 中层说明模块必须保持成立的不变量、前置条件、后置条件和边界假设
    format: Markdown 表格（约束 / 类型 / 由谁维护 / 破坏后果 / 证据）
    trigger:
      - risk_points 非空
      - OR 模块包含状态机、权限、校验、事务、缓存一致性、配置约束
      - OR CodePurpose in [Agent, Service, Api, Dao, Database, Config]
    fallback:
      - 若未发现强不变量，输出关键输入约束和边界假设
    required_context:
      - risk_points
      - public_interfaces
      - state variables
      - validation/error paths

  class-diagram:
    purpose: 展示类/接口的继承和组合关系
    format: Mermaid classDiagram
    trigger:
      - 模块导出 class/struct/interface
      - OR 存在继承关系（extends/implements）
    fallback:
      - 若无继承关系，用接口表格代替
    required_context:
      - 类定义和属性
      - 方法签名
      - 继承关系

  state-diagram:
    purpose: 展示状态机或生命周期
    format: Mermaid stateDiagram-v2
    trigger:
      - CodePurpose == Agent
      - OR 显式状态管理（useState/useReducer/状态模式）
      - OR 生命周期方法（onMount/onDestroy 等）
    fallback:
      - 用文字列表描述状态和转换条件
    required_context:
      - 状态变量定义
      - 状态转换触发条件

  dependency-diagram:
    purpose: 展示模块间的依赖方向
    format: Mermaid flowchart LR
    trigger:
      - 模块有内部依赖或被其他模块依赖
      - OR 依赖数 >= 2
    fallback:
      - 用依赖表格代替
    required_context:
      - import 语句
      - 模块依赖关系

  er-diagram:
    purpose: 展示实体关系、表结构和外键约束
    format: Mermaid erDiagram
    trigger:
      - CodePurpose == Database
      - OR 模块定义了 ORM 模型 / SQL 表 / Prisma schema
    fallback:
      - 实体超过 8 个时仅展示核心实体
      - 无外键时使用简单的表结构列表
      - 复杂关系用 Markdown 表格替代
    required_context:
      - 实体/模型定义
      - 外键关系
      - 字段/列定义

  decision-table:
    purpose: 展示策略选择、条件分支、决策逻辑
    format: Markdown 表格
    trigger:
      - 存在多层处理策略
      - OR 有条件分支逻辑
      - OR 需要对比不同方案
    fallback:
      - 用列表替代
    required_context:
      - 决策条件
      - 各分支结果

  code-example:
    purpose: 展示使用方法
    format: 代码块 + 场景说明
    trigger:
      - 模块复杂度 >= 低
      - OR 公开接口 >= 1
    fallback:
      - 若 LLM 无法生成，仅输出基本调用示例
    required_context:
      - 模块公开接口
      - 典型使用场景

  # ═══════════════════════════════════════════════════════
  # P3 级组件（低优先级）
  # ═══════════════════════════════════════════════════════

  error-table:
    purpose: 错误类型及处理方式
    format: Markdown 表格
    trigger:
      - 模块定义自定义错误类型
      - OR 函数签名包含 throws/Result/Error
      - OR CodePurpose in [Api, Service, Agent, Dao]
    fallback:
      - 若无显式错误定义，跳过
    required_context:
      - 错误类型定义
      - 异常抛出点

  file-structure:
    purpose: 展示模块文件组织
    format: 目录树 + 职责表
    trigger:
      - 模块包含 2+ 源文件
    fallback:
      - 单文件模块用一句话说明
    required_context:
      - 文件列表
      - 每个文件的导出内容

  usage-patterns:
    purpose: 典型使用场景和模式
    format: 场景描述 + 代码 + 预期结果
    trigger:
      - 模块复杂度 >= 中等
      - OR 公开接口 >= 3
      - OR CodePurpose in [SDK, Util, Service]
    fallback:
      - 用多个 code-example 代替
    required_context:
      - 模块公开接口
      - 业务场景

# ── Archetype 覆写规则 ─────────────────────────────────────────────
# 当项目 archetype 匹配时，对基础组件映射进行增删调整。
# 触发条件支持: always / CodePurpose 枚举
# 优先级: archetype_overrides > CodePurpose 基础映射 > 条件触发
archetype_overrides:
  agent-project:
    add:
      - component: architecture-fit
        trigger: "always"
        reason: "Agent 项目需要先解释调度中心、工具、记忆和执行链路的架构位置"
      - component: design-rationale
        trigger: "CodePurpose in [Agent, Service, Entry]"
        reason: "Agent 编排逻辑的设计意图比单纯接口更重要"
      - component: design-patterns
        trigger: "CodePurpose in [Agent, Service]"
        reason: "Agent 项目常见插件注册、策略选择和状态机模式"
      - component: performance-tradeoffs
        trigger: "CodePurpose in [Agent, Service]"
        reason: "Agent 调度常涉及 token、工具调用和并发权衡"
      - component: internal-structure
        trigger: "CodePurpose in [Agent, Service]"
        reason: "Agent 模块内部通常有 planner/tool/memory/executor 分工"
      - component: execution-flow
        trigger: "CodePurpose in [Agent, Service, Entry]"
        reason: "Agent 需要说明从输入到工具调用再到响应的主流程"
      - component: data-flow
        trigger: "CodePurpose in [Agent, Service]"
        reason: "Agent 需要解释消息、上下文、工具结果和状态如何流动"
      - component: side-effects
        trigger: "CodePurpose in [Agent, Service]"
        reason: "Agent 常调用工具、写记忆或产生外部副作用"
      - component: invariants
        trigger: "CodePurpose in [Agent, Service]"
        reason: "Agent 状态、工具调用和记忆一致性需要约束说明"
      - component: state-diagram
        trigger: "always"
        reason: "Agent 项目状态流转是核心关注点"
      - component: decision-table
        trigger: "CodePurpose in [Service, Agent]"
        reason: "Agent 决策逻辑适合决策表展示"
    remove:
      - component: sequence-diagram
        trigger: "CodePurpose not in [Api, Entry, Service]"
        reason: "Agent 非 API 模块通常无请求-响应时序"

  ml-project:
    add:
      - component: performance-tradeoffs
        trigger: "CodePurpose in [Service, Database]"
        reason: "ML 项目的数据加载、训练和推理通常性能敏感"
      - component: design-rationale
        trigger: "CodePurpose in [Service, Config]"
        reason: "模型、数据和超参数选择需要设计解释"
      - component: data-flow
        trigger: "CodePurpose in [Service, Database]"
        reason: "ML 模块核心是数据从加载到特征、模型和结果的流动"
      - component: execution-flow
        trigger: "CodePurpose in [Entry, Service]"
        reason: "训练/推理流程需要中层执行链路"
      - component: invariants
        trigger: "CodePurpose in [Service, Config]"
        reason: "数据 shape、特征和超参数存在关键约束"
      - component: decision-table
        trigger: "CodePurpose in [Service, Config]"
        reason: "ML 超参数/配置策略适合决策表"
    remove:
      - component: sequence-diagram
        trigger: "CodePurpose not in [Api, Entry]"
        reason: "ML 模块通常无请求-响应时序"

  cli-tool:
    add:
      - component: architecture-fit
        trigger: "CodePurpose in [Entry, Command]"
        reason: "CLI 需要解释命令树、配置加载和输出层边界"
      - component: design-rationale
        trigger: "CodePurpose in [Entry, Command]"
        reason: "命令解析和执行分层需要设计说明"
      - component: execution-flow
        trigger: "CodePurpose in [Entry, Command]"
        reason: "CLI 需要说明参数解析、配置加载、执行和输出链路"
      - component: side-effects
        trigger: "CodePurpose in [Command]"
        reason: "CLI 命令常写文件、调用网络或修改环境"
      - component: architecture-diagram
        trigger: "CodePurpose == Entry"
        reason: "CLI 命令树用 flowchart 展示更清晰"
    remove:
      - component: state-diagram
        trigger: "CodePurpose not in [Agent]"
        reason: "CLI 工具通常无状态管理"

  sdk-library:
    add:
      - component: design-rationale
        trigger: "always"
        reason: "SDK 需要解释 API 形状和抽象边界"
      - component: tradeoff-analysis
        trigger: "CodePurpose in [Api, Service, Util]"
        reason: "SDK API 设计常需要兼顾易用性、兼容性和扩展性"
      - component: internal-structure
        trigger: "CodePurpose in [Api, Service]"
        reason: "SDK 需要解释 public API、内部 adapter 和 transport 的分工"
      - component: data-flow
        trigger: "CodePurpose in [Api, Service]"
        reason: "SDK 需要解释调用参数如何变为请求或结果对象"
      - component: invariants
        trigger: "CodePurpose in [Api, Service, Util]"
        reason: "SDK 需要明确 API 契约和兼容性约束"
      - component: usage-patterns
